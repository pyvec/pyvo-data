topic: "#PyVo VÝJIMEČNĚ online – Python, data a AI v praxi"

description: |
  Liberecké Pyvo se tentokrát VÝJIMEČNĚ přesouvá do online prostoru!

  V sobotu 28. listopadu 2026 od 13:00 do 15:00
  připravujeme komunitní blok věnovaný Pythonu,
  práci s daty, umělé inteligenci a automatizaci.

  Setkání je součástí celodenní online konference
  **Firma na autopilotu? Data, AI a Python v řízení podniku**,
  kterou pořádá spolek eKultura ve spolupráci s PyLiberec.

  Čeká nás praktické využití Pythonu, sdílení zkušeností,
  zajímavé projekty a diskuse o využití technologií
  v každodenní práci a podnikání.

  Vítáni jsou začátečníci, zkušení pythonisté
  i všichni zájemci o technologie.


  A pokud vám bude chybět tradiční PyVo u piva, můžeme se po konferenci sejít i osobně. Třeba v sobotu večer na jedno nebo v neděli dopoledne v kavárně. :)

  Tentokrát jsme ale zvolili online formát záměrně. PyVo je součástí širší konference, která propojuje Python, data, AI a ekonomiku a umožňuje účast lidem z celé republiky.

  **Kdy:** sobota 28. 11. 2026, 13:00–15:00

  **Kde:** online, Google Meet

  **Vstup:** zdarma, registrace na webu konference.

  [Program a registrace](https://konference.ekultura.eu/)

  [PyLiberec](https://pyliberec.cz/)

