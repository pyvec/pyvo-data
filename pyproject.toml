[project]
name = "pyvo-data"
version = "0"
description = "Data about Pyvo meetups in the Czech Republic"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "jsonschema>=4.23,<5",
    "rfc3987>=1.3.8,<2",
    "pyyaml>=6,<7",
    "python-dateutil>=2.8,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
